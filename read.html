<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Read News | DailySelibreti</title>

<!-- Open Graph Meta Tags (Default Fallback) -->
<meta property="og:type" content="article">
<meta property="og:title" id="ogTitle" content="DailySelibreti News">
<meta property="og:description" id="ogDesc" content="ताजा समाचार र मनोरञ्जनका खबरहरू">
<meta property="og:image" id="ogImage" content="https://www.dailyselibreti.com/logo.png">
<meta property="og:url" id="ogUrl" content="https://www.dailyselibreti.com">

<!-- Google Nepali News Fonts (Mukta & Noto Sans Devanagari) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--red:#e50925;--dark:#151515;--text:#222222;--muted:#666;--line:#eee}
*{box-sizing:border-box}

body{
  margin:0;
  padding:0;
  background:#ffffff;
  color:var(--text);
  font-family:'Mukta', 'Noto Sans Devanagari', sans-serif;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

a{text-decoration:none;color:inherit}
.wrap{width:100%;max-width:1120px;margin:auto;padding:0 16px}

/* Header Section */
.header{background:#111;color:white;border-bottom:4px solid var(--red)}
.header-inner{min-height:65px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;background:var(--red);border-radius:8px;display:grid;place-items:center;font:900 19px sans-serif;color:#fff}
.brand-title{font:900 23px sans-serif}.brand-title span{color:#ff4056}
.back{font-size:13px;background:#2b2b2b;color:white;border:1px solid #454545;border-radius:4px;padding:6px 12px}

.breadcrumb{font-size:14px;color:#777;margin:15px 0 10px}
.breadcrumb a{color:var(--red);font-weight:600}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:30px;align-items:start}

/* Article Area */
.article{
  background:#ffffff;
  padding:0;
  margin-bottom:30px;
}

/* Compact Small Banner Ad Styling Below Label */
.top-ad-banner{
  margin:10px 0 16px;
  background:#fff;
  border:1px dashed #d0d0d0;
  border-radius:4px;
  padding:6px 10px;
  text-align:center;
}
.ad-label{font-size:10px;text-transform:uppercase;color:#888;letter-spacing:0.5px;margin-bottom:3px;display:block;}
.top-ad-banner .ad-slot{font-size:12px;color:#555;font-weight:600;min-height:48px;background:#f9f9f9;display:flex;align-items:center;justify-content:center;border-radius:3px;overflow:hidden;}

.label{
  display:inline-block;
  background:var(--red);
  color:white;
  padding:4px 12px;
  font-size:13px;
  font-weight:800;
  border-radius:2px;
  text-transform:uppercase;
}

/* Main Title Styling */
h1{
  font-size:clamp(26px, 5.5vw, 38px);
  line-height:1.35;
  margin:16px 0 14px;
  font-weight:800;
  color:#000000;
  letter-spacing:-0.2px;
}

/* Meta Data Info */
.meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  color:#555;
  font-size:15px;
  font-weight:600;
  padding-bottom:14px;
  margin-bottom:18px;
  border-bottom:1px solid var(--line);
}
.meta-item{display:inline-flex;align-items:center;gap:5px}

/* Full Bleed Cover Photo & Inline Photo/Video Wrapper */
.cover-container, .article-inline-img-wrap, .article-inline-video-wrap {
  width: 100vw;
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
  margin-top: 25px;
  margin-bottom: 25px;
  background: #111;
}
.cover{
  width:100%;
  max-height:550px;
  object-fit:cover;
  display:block;
}
.caption{font-size:14px;color:#777;margin-bottom:22px;text-align:center;font-style:italic;padding:0 15px}

/* Article Content & Typography */
.content{
  font-family: 'Mukta', 'Noto Sans Devanagari', sans-serif;
  font-size: 21px;
  font-weight: 500;
  line-height: 1.85;
  color: #222222;
  text-align: justify;
  word-break: normal;
  overflow-wrap: break-word;
}
.content p{
  margin-bottom: 24px;
  font-weight: 500;
  letter-spacing: 0.1px;
}

.article-inline-img-wrap img {
  width: 100% !important;
  max-height: 550px !important;
  object-fit: cover !important;
  display: block !important;
  border-radius: 0 !important;
  margin: 0 !important;
  box-shadow: none !important;
}

/* YouTube Video Responsive Full Bleed Container */
.video-responsive-container {
  position: relative;
  padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
  height: 0;
  overflow: hidden;
  width: 100%;
  background: #000;
}
.video-responsive-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

/* Subheadings / Film Names Styling (h2, h3) */
.content h2, .content h3{
  font-size: 24px;
  line-height: 1.4;
  margin-top: 36px;
  margin-bottom: 16px;
  font-weight: 800;
  color: #000;
  text-align: left;
  border-left: 5px solid var(--red);
  padding-left: 12px;
  background: #fdfdfd;
  padding-top: 6px;
  padding-bottom: 6px;
  border-radius: 0 6px 6px 0;
}
.content a{color:var(--red);text-decoration:underline}

/* Automatic In-Article Banner Ad Slot */
.auto-ad-banner{
  margin:24px 0;
  padding:0;
  background:transparent;
  border:none;
  text-align:center;
  overflow:hidden;
  width:100%;
}
.ad-tag{font-size:10px;text-transform:uppercase;color:#888;letter-spacing:1px;display:block;margin-bottom:4px;text-align:center;}
.auto-ad-banner .ad-slot{width:100%;background:#ffffff;display:flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden;}

/* Share Buttons */
.share-section{border-top:1px solid var(--line);padding-top:22px;margin-top:35px}
.share-title{font-size:16px;font-weight:700;margin-bottom:14px;color:#222}
.share-buttons{display:flex;flex-wrap:wrap;gap:10px}
.share-btn{
  border:0;
  color:white;
  border-radius:6px;
  padding:11px 18px;
  font-size:14px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.share-btn svg{width:18px;height:18px;fill:currentColor}
.btn-fb{background:#1877f2}
.btn-tw{background:#000000}
.btn-wa{background:#25d366}
.btn-tg{background:#24A1DE}
.btn-copy{background:#444}

/* Custom Toast Notification */
.toast-msg {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #111111;
  color: #ffffff;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  z-index: 9999;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast-msg.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Sidebar & Related */
.sidebar{background:#fff;border-top:2px solid var(--red);padding-top:15px}
.sidebar h2{font-size:20px;margin:0 0 18px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:800}
.related{display:flex;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.related img{width:100px;height:75px;object-fit:cover;background:#eee;border-radius:4px}
.related h3{font-size:15px;line-height:1.4;margin:0;font-weight:700}
.related a:hover{color:var(--red)}
.related small{font-size:12px;color:#888}

.footer{background:#111;color:#bbb;text-align:center;padding:25px 10px;margin-top:40px;font-size:13px}
.state{background:#fff;padding:40px;text-align:center;color:#666;font-size:16px}

@media(max-width:800px){
  .wrap{width:100%;padding:0 15px}
  .layout{grid-template-columns:1fr;gap:20px}
  .content{font-size:20px;line-height:1.8}
  .share-buttons{display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>
