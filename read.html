<head>

<style>
:root{--red:#e50925;--dark:#151515;--text:#222222;--muted:#666;--line:#eee}
*{box-sizing:border-box}

body{
  margin:0;
  padding:0;
  background:#ffffff;
  color:var(--text);
  font-family:'Mukta', 'Noto Sans Devanagari', sans-serif;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

a{text-decoration:none;color:inherit}
.wrap{width:100%;max-width:1120px;margin:auto;padding:0 16px}

/* Header Section */
.header{background:#111;color:white;border-bottom:4px solid var(--red)}
.header-inner{min-height:65px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;background:var(--red);border-radius:8px;display:grid;place-items:center;font:900 19px sans-serif;color:#fff}
.brand-title{font:900 23px sans-serif}.brand-title span{color:#ff4056}
.back{font-size:13px;background:#2b2b2b;color:white;border:1px solid #454545;border-radius:4px;padding:6px 12px}

.breadcrumb{font-size:14px;color:#777;margin:15px 0 10px}
.breadcrumb a{color:var(--red);font-weight:600}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:30px;align-items:start}

/* Article Area */
.article{
  background:#ffffff;
  padding:0;
  margin-bottom:30px;
}

/* Compact Small Banner Ad Styling Below Label */
.top-ad-banner{
  margin:10px 0 16px;
  background:#fff;
  border:1px dashed #d0d0d0;
  border-radius:4px;
  padding:6px 10px;
  text-align:center;
}
.ad-label{font-size:10px;text-transform:uppercase;color:#888;letter-spacing:0.5px;margin-bottom:3px;display:block;}
.top-ad-banner .ad-slot{font-size:12px;color:#555;font-weight:600;min-height:48px;background:#f9f9f9;display:flex;align-items:center;justify-content:center;border-radius:3px;overflow:hidden;}

.label{
  display:inline-block;
  background:var(--red);
  color:white;
  padding:4px 12px;
  font-size:13px;
  font-weight:800;
  border-radius:2px;
  text-transform:uppercase;
}

/* Main Title Styling */
h1{
  font-size:clamp(26px, 5.5vw, 38px);
  line-height:1.35;
  margin:16px 0 14px;
  font-weight:800;
  color:#000000;
  letter-spacing:-0.2px;
}

/* Meta Data Info */
.meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  color:#555;
  font-size:15px;
  font-weight:600;
  padding-bottom:14px;
  margin-bottom:18px;
  border-bottom:1px solid var(--line);
}
.meta-item{display:inline-flex;align-items:center;gap:5px}

/* Full Bleed Cover Photo (Main Thumbnail) */
.cover-container{
  width:100vw;
  position:relative;
  left:50%;
  right:50%;
  margin-left:-50vw;
  margin-right:-50vw;
  margin-top:15px;
  margin-bottom:10px;
  background:#111;
}
.cover{
  width:100%;
  max-height:550px;
  object-fit:cover;
  display:block;
}
.caption{font-size:14px;color:#777;margin-bottom:22px;text-align:center;font-style:italic;padding:0 15px}

/* Article Content & Typography */
.content{
  font-family: 'Mukta', 'Noto Sans Devanagari', sans-serif;
  font-size: 21px;
  font-weight: 500;
  line-height: 1.85;
  color: #222222;
  text-align: justify;
  word-break: normal;
  overflow-wrap: break-word;
}
.content p{
  margin-bottom: 24px;
  font-weight: 500;
  letter-spacing: 0.1px;
}

/* In-Article Photos - Full Screen Width Like Cover Photo */
.article-inline-img-wrap {
  width: 100vw;
  position: relative;
  left: 50%;
  right: 50%;
  margin-left: -50vw;
  margin-right: -50vw;
  margin-top: 25px;
  margin-bottom: 25px;
  background: #111;
}
.article-inline-img-wrap img {
  width: 100% !important;
  max-height: 550px !important;
  object-fit: cover !important;
  display: block !important;
  border-radius: 0 !important;
  margin: 0 !important;
  box-shadow: none !important;
}

.content h2,.content h3{
  font-size: 25px;
  line-height: 1.4;
  margin-top: 32px;
  margin-bottom: 14px;
  font-weight: 800;
  color: #000;
  text-align: left;
}
.content a{color:var(--red);text-decoration:underline}

/* Automatic In-Article Banner Ad Slot */
.auto-ad-banner{
  margin:24px 0;
  padding:0;
  background:transparent;
  border:none;
  text-align:center;
  overflow:hidden;
  width:100%;
}
.ad-tag{font-size:10px;text-transform:uppercase;color:#888;letter-spacing:1px;display:block;margin-bottom:4px;text-align:center;}
.auto-ad-banner .ad-slot{width:100%;background:#ffffff;display:flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden;}

/* Share Buttons */
.share-section{border-top:1px solid var(--line);padding-top:22px;margin-top:35px}
.share-title{font-size:16px;font-weight:700;margin-bottom:14px;color:#222}
.share-buttons{display:flex;flex-wrap:wrap;gap:10px}
.share-btn{
  border:0;
  color:white;
  border-radius:6px;
  padding:11px 18px;
  font-size:14px;
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.share-btn svg{width:18px;height:18px;fill:currentColor}
.btn-fb{background:#1877f2}
.btn-tw{background:#000000}
.btn-wa{background:#25d366}
.btn-tg{background:#24A1DE}
.btn-copy{background:#444}

/* Custom Toast Notification */
.toast-msg {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #111111;
  color: #ffffff;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  z-index: 9999;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast-msg.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Sidebar & Related */
.sidebar{background:#fff;border-top:2px solid var(--red);padding-top:15px}
.sidebar h2{font-size:20px;margin:0 0 18px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:800}
.related{display:flex;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.related img{width:100px;height:75px;object-fit:cover;background:#eee;border-radius:4px}
.related h3{font-size:15px;line-height:1.4;margin:0;font-weight:700}
.related a:hover{color:var(--red)}
.related small{font-size:12px;color:#888}

.footer{background:#111;color:#bbb;text-align:center;padding:25px 10px;margin-top:40px;font-size:13px}
.state{background:#fff;padding:40px;text-align:center;color:#666;font-size:16px}

@media(max-width:800px){
  .wrap{width:100%;padding:0 15px}
  .layout{grid-template-columns:1fr;gap:20px}
  .content{font-size:20px;line-height:1.8}
  .share-buttons{display:grid;grid-template-columns:1fr 1fr}
}
</style>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {getFirestore,doc,getDoc,collection,getDocs,updateDoc,increment,setDoc} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBD6DjQC2NwiOCR3crvsn7qwSaFZ5PPQNk",
 authDomain:"daily-selibreti.firebaseapp.com",
 projectId:"daily-selibreti",
 storageBucket:"daily-selibreti.firebasestorage.app",
 messagingSenderId:"445067708773",
 appId:"1:445067708773:web:526028f35a01c29b95f98c"
};

const $=id=>document.getElementById(id);$("year").textContent=new Date().getFullYear();

function showToast(text="समाचारको लिंक Copy गरियो!"){
  const toast = $("toast");
  $("toastText").textContent = text;
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); }, 3000);
}

function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function safeImage(p){const u=String(p.imageUrl||p.image||"");return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:"";}
function safeDate(p){let v=p.createdAt||p.date;let d=v?.toDate?v.toDate():v?new Date(v):null;return d&&!isNaN(d.getTime())?d.toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"}):"DailySelibreti";}

let globalAds = {};

// सुरक्षित र भरपर्दो (Dual API) कन्ट्री डिटेक्टिङ फंक्सन
async function getUserCountry() {
  try {
    const res = await fetch("https://ipapi.co/json/");
    if (res.ok) {
      const data = await res.json();
      if (data.country_name) return data.country_name;
    }
  } catch(e) {}

  try {
    const res2 = await fetch("https://ipapi.co/json/"); // Fallback
    const resAlt = await fetch("https://ip-api.com/json/");
    if (resAlt.ok) {
      const data2 = await resAlt.json();
      if (data2.country) return data2.country;
    }
  } catch(e) {}

  return "Nepal";
}

// विज्ञापन इम्प्रेशन काउन्ट गर्ने फंक्सन
async function trackAdImpression(db, adType) {
  try {
    const adRef = doc(db, "settings", "adStats");
    await setDoc(adRef, {
      [adType]: increment(1),
      totalImpressions: increment(1)
    }, { merge: true });
  } catch (e) {
    console.error("Ad Impression Track Error:", e);
  }
}

function executeScriptTags(container, db) {
  const scripts = container.querySelectorAll("script");
  scripts.forEach(oldScript => {
    const newScript = document.createElement("script");
    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
    if(oldScript.innerHTML) {
      newScript.appendChild(document.createTextNode(oldScript.innerHTML));
    }
    oldScript.parentNode.replaceChild(newScript, oldScript);
    trackAdImpression(db, "customAdSlot");
  });
}

function loadMonetagAd(code, db) {
  if (!code) return;
  const div = document.createElement('div');
  div.innerHTML = code;
  document.body.appendChild(div);

  const scripts = div.querySelectorAll("script");
  scripts.forEach(oldScript => {
    const newScript = document.createElement("script");
    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
    if (oldScript.innerHTML) {
      newScript.appendChild(document.createTextNode(oldScript.innerHTML));
    }
    oldScript.parentNode.replaceChild(newScript, oldScript);
  });
  trackAdImpression(db, "monetag");
}

function renderTextWithAdsAndPhotos(text, db){
  const cleanStr = String(text||"").trim();
  if(!cleanStr) return "";

  const blocks = cleanStr.split(/(<img[^>]*>|\n+)/i).map(b => b.trim()).filter(Boolean);
  
  let accumulatedWords = 0;
  let nextAdThreshold = 70;
  let adSequenceIndex = 0;
  let htmlOutput = "";

  const adAdSense = (globalAds && globalAds.adSense70) ? globalAds.adSense70 : ''; 
  const adCompanyA = (globalAds && globalAds.companyA) ? globalAds.companyA : '';
  const adCompanyB = (globalAds && globalAds.companyB) ? globalAds.companyB : '';
  const adCompanyC = (globalAds && globalAds.companyC) ? globalAds.companyC : '';

  const sequenceAds = [adAdSense, adCompanyA, adCompanyB, adCompanyC].filter(Boolean);

  blocks.forEach((block) => {
    if (/^<img[^>]*>$/i.test(block)) {
      htmlOutput += `
        <div class="article-inline-img-wrap">
          ${block}
        </div>
      `;
      return;
    }

    const photoMatch = block.match(/^\[PHOTO:\s*(https?:\/\/[^\s]+)\]$/i);
    if (photoMatch) {
      const imgUrl = photoMatch[1];
      htmlOutput += `
        <div class="article-inline-img-wrap">
          <img class="article-inline-img" src="${esc(imgUrl)}" alt="Article Photo" loading="lazy">
        </div>
      `;
      return;
    }

    const lines = block.split(/\n+/);
    lines.forEach(line => {
      if(!line.trim()) return;

      const wordsInLine = line.split(/\s+/).filter(Boolean).length;
      accumulatedWords += wordsInLine;

      htmlOutput += `<p>${esc(line)}</p>`;

      if (accumulatedWords >= nextAdThreshold && sequenceAds.length > 0) {
        const currentAd = sequenceAds[adSequenceIndex % sequenceAds.length];

        if (currentAd) {
          trackAdImpression(db, "inArticleAd");
          htmlOutput += `
            <div class="auto-ad-banner">
              <span class="ad-tag">Advertisement / विज्ञापन</span>
              <div class="ad-slot inline-ad-container">${currentAd}</div>
            </div>
          `;
        }

        adSequenceIndex++;
        nextAdThreshold += 70;
      }
    });
  });

  return htmlOutput;
}

function articleLink(p){return "read.html?"+(p.demo?"demo=1&":"")+"id="+encodeURIComponent(p.id);}
function relatedCard(p){return `<div class="related"><a href="${articleLink(p)}">${safeImage(p)?`<img src="${esc(safeImage(p))}" alt="">`:""}</a><div><h3><a href="${articleLink(p)}">${esc(p.title||"News")}</a></h3><small>${esc(p.category||"News")}</small></div></div>`;}

function updateMetaTags(post, url){
  const title = post.title || "DailySelibreti";
  const desc = post.excerpt || post.summary || "DailySelibreti News Update";
  const img = safeImage(post);

  document.title = title + " | DailySelibreti";
  $("ogTitle").setAttribute("content", title);
  $("ogDesc").setAttribute("content", desc);
  $("ogUrl").setAttribute("content", url);
  if(img) $("ogImage").setAttribute("content", img);
}

async function load(){
 const params=new URLSearchParams(location.search);
 const id=params.get("id");
 
 if(!id || id === "null" || id === "undefined"){
    $("pageState").textContent="समाचार ID भेटिएन। Home पेजमा फर्कनुहोस्।";
    return;
 }

 let post=null,all=[];
 try{
   const app=initializeApp(firebaseConfig),db=getFirestore(app);

   try {
     const adSnap = await getDoc(doc(db, "settings", "ads"));
     if (adSnap.exists()) {
       globalAds = adSnap.data();
       if (globalAds.monetag) {
         loadMonetagAd(globalAds.monetag, db);
       }
     }
   } catch(err) {
     console.error("Ads fetch error:", err);
   }

   const docRef = doc(db,"news",id);
   const snap=await getDoc(docRef);
   
   if(snap.exists()){
    const p={id:snap.id,...snap.data()};
    if(["published","publish"].includes(String(p.status||"").toLowerCase().trim())){
      post=p;
      try {
        const userCountry = await getUserCountry();
        const safeCountryKey = userCountry.replace(/[./[\]#$]/g, "_");

        const updateObj = { views: increment(1) };
        updateObj[`countries.${safeCountryKey}`] = increment(1);

        await updateDoc(docRef, updateObj);
        post.views = (post.views || 0) + 1;
      } catch(e) { 
        console.error("View/Country count update error:", e);
        post.views = (post.views || 0) + 1; 
      }
    }
   }
   const list=await getDocs(collection(db,"news"));
   all=list.docs.map(d=>({id:d.id,...d.data()})).filter(p=>["published","publish"].includes(String(p.status||"").toLowerCase().trim()));

   trackAdImpression(db, "pageViewsWithAds");

   const topAdElem = $("topAdSlot");
   if (globalAds && globalAds.header) {
     topAdElem.innerHTML = globalAds.header;
     executeScriptTags(topAdElem, db);
     trackAdImpression(db, "headerAd");
   } else {
     topAdElem.innerHTML = "[ Small Top Ad Banner Area ]";
   }

   const raw=post.content||post.body||post.article||post.excerpt||post.summary||"यस समाचारको पूरा विवरण उपलब्ध छैन।";
   const contentElem = $("content");
   contentElem.innerHTML = renderTextWithAdsAndPhotos(raw, db);
   executeScriptTags(contentElem, db);

 }catch(e){console.error(e);}

 if(!post){
   $("pageState").textContent="यो समाचार भेटिएन वा प्रकाशित गरिएको छैन। Home मा फर्केर अर्को समाचार खोल्नुहोस्।";
   return;
 }

 updateMetaTags(post, location.href);

 $("pageState").hidden=true;$("layout").hidden=false;
 $("title").textContent=post.title||"News";
 $("category").textContent=post.category||"NEWS";
 $("crumb").textContent=post.category||"News";
 $("date").textContent=safeDate(post);
 $("caption").textContent=post.imageCaption||post.imageCredit||"";
 $("viewsCount").textContent = Number(post.views || 1).toLocaleString('ne-NP');

 const src=safeImage(post);
 if(src){
   $("cover").src=src;
   $("cover").alt=post.title||"News";
 } else {
   $("coverWrap").hidden=true;
 }

 $("related").innerHTML=all.filter(p=>p.id!==post.id).slice(0,5).map(relatedCard).join("")||"थप समाचार उपलब्ध छैन।";

 const postFullUrl = "https://www.dailyselibreti.com/read.html?id=" + encodeURIComponent(post.id);
 const currentUrl = encodeURIComponent(postFullUrl);
 const shareText = encodeURIComponent(post.title || "");

 $("shareFb").onclick = () => window.open(`https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`, '_blank');
 $("shareTw").onclick = () => window.open(`https://twitter.com/intent/tweet?url=${currentUrl}&text=${shareText}`, '_blank');
 $("shareWa").onclick = () => window.open(`https://api.whatsapp.com/send?text=${shareText}%20${currentUrl}`, '_blank');
 $("shareTg").onclick = () => window.open(`https://t.me/share/url?url=${currentUrl}&text=${shareText}`, '_blank');

 $("copyBtn").onclick=async()=>{
  try{
    await navigator.clipboard.writeText(postFullUrl);
    showToast("समाचारको लिंक Copy गरियो!");
  } catch(e){
    showToast("लिंक Copy गर्न सकिएन!");
  }
 };
}

load();
</script>
</body>
</html>
